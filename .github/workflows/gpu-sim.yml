name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the HIP backend for gfx942 and runs tests/attention_hip_tests.cpp on a
# simulated AMD Instinct MI300X (https://github.com/pantheongpu/pantheonsim).
# The test compares the tiled HIP kernel with the CPU oracle. A simulator
# cannot reproduce hardware-specific behavior or timing, so this complements
# real-GPU testing (the project targets RDNA4) and does not replace it.

on:
  push:
    branches: [ verify-gpu-sim ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "include/**"
      - "tests/attention_hip_tests.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hip-tests:
    name: HIP attention test (ROCm 7.2 and simulated MI300X)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.2"

      - name: Install ROCm runtime libraries
        run: sudo apt-get install -y comgr hsa-rocr

      # The kernels use warpSize rather than a fixed wave width, so they also
      # build for gfx942 (wave64); CI's own hip-compile job targets gfx1201.
      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DWAVE_ENABLE_HIP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DCMAKE_PREFIX_PATH=/opt/rocm
          cmake --build build --parallel 3

      # The test exits 77 when no device is found, and ctest reports that as
      # skipped, so run the binary directly and require a clean exit 0.
      - name: Run the HIP test
        run: |
          vgpu run build/wave_hip_tests 2>&1 | tee hip-test.log
          test "${PIPESTATUS[0]}" -eq 0

      # wave_bench prints the device it ran on; require the simulated MI300X.
      - name: Device banner
        run: |
          vgpu run build/wave_bench --backend hip --algorithm tiled --heads 2 \
            --sequence 64 --dimension 64 --warmup 0 --iterations 1 --verify 2>&1 | tee bench.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -Ei "^device: .*(MI300|gfx942)" bench.log

      - name: Check the test ran on the device
        run: |
          grep -q "all 144 tiled HIP correctness cases passed" hip-test.log
          ! grep -Ei "VirtualGPU error|no device|unavailable|skipping|no HIP-capable" hip-test.log bench.log
